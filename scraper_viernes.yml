name: Vuelo Viernes 21-Aug

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          GMAIL_SENDER:     ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:   ${{ secrets.GMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          DEPARTURE_DATE:   "2026-08-21"
          RETURN_DATE:      "2026-09-06"
          PRICE_THRESHOLD:  "1000"
        run: python src/scraper.py

      - name: Upload debug HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-viernes-${{ github.run_id }}
          path: debug_*.html
          retention-days: 3

      - name: Upload flights log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-viernes-${{ github.run_id }}
          path: flights_log.json
          if-no-files-found: ignore
          retention-days: 30
